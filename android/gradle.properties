# إعدادات الذاكرة لمحرك Gradle و Kotlin (لتحسين الأداء ومنع الانهيار)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# تفعيل دعم AndroidX و Jetifier
android.useAndroidX=true
android.enableJetifier=true

# تعطيل التجميع التزايدي لتفادي مشكلة الانهيار بين أقراص النظام (C و D)
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false